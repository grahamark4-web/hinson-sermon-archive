<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sermon Archive | Hinson Baptist Church</title><meta name="description" content="Find Hinson Baptist Church sermons by Scripture, preacher, title, and series."><link rel="stylesheet" href="styles.css?v=aligned-transcript-actions-1"><script src="search.js?v=scripture-priority-1" defer></script><script src="interactions.js?v=aligned-transcript-actions-1" defer></script><script src="app.js?v=church-sharing-2" defer></script></head>
<body><main><header><h1>Sermon Archive</h1><p class="intro">Explore the Scriptures. Find a sermon. Listen and grow.</p><nav class="podcast-subscribe" aria-label="Follow the sermon podcast"><a class="subscribe-logo" href="https://open.spotify.com/show/5K1tGao0YJfapg97suw7Y5" target="_blank" rel="noopener" aria-label="Follow on Spotify" title="Spotify"><img src="assets/spotify.svg" width="24" height="24" alt="" aria-hidden="true"></a><a class="subscribe-logo" href="https://podcasts.apple.com/us/podcast/hinson-baptist-church-sermons/id509448288" target="_blank" rel="noopener" aria-label="Follow on Apple Podcasts" title="Apple Podcasts"><img src="assets/apple-podcasts.svg" width="24" height="24" alt="" aria-hidden="true"></a></nav></header>
<section class="search-panel" aria-label="Search sermons"><label for="query">Search the archive</label><div class="search-row"><div class="search-input-wrap"><input id="query" type="search" placeholder="Try Romans 8:28, Michael Lawrence, or a sermon title"></div><button id="clear" type="button" hidden>Clear filters</button></div><div class="search-settings"><label class="transcript-toggle" for="transcripts"><input id="transcripts" type="checkbox" role="switch"><span>Search transcripts</span></label><p id="transcript-status" class="transcript-status" role="status" aria-live="polite">Sermon transcription is in progress.</p></div><details class="filter-disclosure" open><summary>Filter sermons<span class="filter-chevron" aria-hidden="true">⌄</span></summary><div class="filters"><div><label for="book">Book of the Bible</label><select id="book"><option value="">All books</option></select></div><div><label for="speaker">Preacher</label><select id="speaker"><option value="">All preachers</option></select></div><div><label for="series">Sermon series</label><select id="series"><option value="">All series</option></select></div><div><label for="year">Year</label><select id="year"><option value="">All years</option></select></div></div></details></section>
<section aria-label="Sermon results"><div class="results-bar"><p id="status" role="status" aria-live="polite">Loading the sermon archive…</p><div class="sort-control"><label for="sort">Sort</label><select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="title">Title A–Z</option></select></div></div><div id="results"></div><button id="more" hidden>Show more sermons</button></section><footer><p id="updated"></p></footer></main><aside id="mini-player" class="mini-player" aria-label="Sermon audio player" hidden>
<div class="player-progress-track" aria-hidden="true"><div id="player-progress"></div></div>
<div class="player-heading"><p id="player-title"></p></div>
<div class="player-controls"><button id="player-back" type="button" aria-label="Rewind 15 seconds"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 8a10 10 0 1 1-10 10M16 8h-5m5-5-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="16" y="22" text-anchor="middle" fill="currentColor" font-size="12" font-weight="500" font-family="Arial,sans-serif">15</text></svg></button><button id="player-toggle" type="button" aria-label="Play sermon" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button><button id="player-forward" type="button" aria-label="Forward 15 seconds"><svg viewBox="0 0 32 32" aria-hidden="true"><path transform="translate(32 0) scale(-1 1)" d="M16 8a10 10 0 1 1-10 10M16 8h-5m5-5-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="16" y="22" text-anchor="middle" fill="currentColor" font-size="12" font-weight="500" font-family="Arial,sans-serif">15</text></svg></button></div>
<div class="player-timeline"><input id="player-seek" type="range" min="0" max="1" value="0" step="1" aria-label="Playback position" disabled><span id="player-time">0:00 / 0:00</span></div>
<div class="player-utilities"><button id="player-close" type="button" aria-label="Close audio player">×</button></div>
<p id="player-notice" role="status" aria-live="polite"></p><audio id="archive-audio" preload="metadata"></audio></aside></body></html>
