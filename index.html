<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sermon Archive | Hinson Baptist Church</title><meta name="description" content="Find Hinson Baptist Church sermons by Scripture, preacher, title, and series."><link rel="stylesheet" href="styles.css?v=transcript-toggle-1"><script src="search.js?v=scripture-priority-1" defer></script><script src="app.js?v=exact-transcript-1" defer></script></head>
<body><main><header><h1>Sermon Archive</h1><p class="intro">Explore the Scriptures. Find a sermon. Listen and grow.</p><nav class="podcast-subscribe" aria-label="Follow the sermon podcast"><a class="subscribe-logo" href="https://open.spotify.com/show/5K1tGao0YJfapg97suw7Y5" target="_blank" rel="noopener" aria-label="Follow on Spotify" title="Spotify"><img src="assets/spotify.svg" width="24" height="24" alt="" aria-hidden="true"></a><a class="subscribe-logo" href="https://podcasts.apple.com/us/podcast/hinson-baptist-church-sermons/id509448288" target="_blank" rel="noopener" aria-label="Follow on Apple Podcasts" title="Apple Podcasts"><img src="assets/apple-podcasts.svg" width="24" height="24" alt="" aria-hidden="true"></a></nav></header>
