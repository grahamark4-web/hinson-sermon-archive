name: Refresh sermon catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
  push:
    branches: [main]
    paths: ['build_index.py', 'platform_links.py', 'test_platform_links.py', 'search.js', 'test_search.cjs', '.github/workflows/refresh-sermons.yml']
permissions:
  contents: write
concurrency:
  group: sermon-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify search behavior
        run: |
          node test_search.cjs
          python test_platform_links.py
      - name: Index and validate the public archive
        run: python build_index.py
      - name: Save the refreshed catalog
        run: |
          git config user.name "Hinson catalog updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sermons.json catalog-report.json podcast-links.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh sermon catalog"
            git push
          fi
